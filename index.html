// 🔄 오징어 게임처럼 한 맵 안에서 깬다(D-86). 훈련장(깨어난 자리 → 기구) → 문 → 성소(일곱 석상 · 수녀)(D-105) → 문 → 오솔길(D-158). 방 사이는 벽으로 막혀 문으로만 건넌다. 후보생의 움직임 · 공격 · 방어 · 패링은 sim.js 그대로다.
(function (root) {
  'use strict';
  const S = root.QueenSim || require('./sim.js'), { DT } = S;
  const T = {
    W: 3600, spawnY: 105, // 🔄 2000 → 3600 — 오솔길을 늘려 «길»로 쓴다(road.js · D-223)
    // 방 셋은 벽으로 나뉜다(D-88). 벽 사이는 외길 — 양옆이 낭떠러지다
    room1: 300, room3: 930, land: 836, walkY: [72, 138], // land = 다리가 끝나고 버튼 단이 시작하는 곳(D-158)
    // 방 셋(D-158) — 벽으로 막혀 있다. x0 · x1 = 걸을 수 있는 끝
    rooms: [{ x0: -100, x1: 922, camLo: 110 }, // camLo — 🔸 D-288 첫 방은 카메라가 왼쪽 끝 벽까지 본다(옛 165 = 벽 없이 바닥이 잘려 비어 보였다)
       { x0: 1008, x1: 1352 }, { x0: 1438, x1: 3600 }],
    // 문 — 그 방의 x 에 서서 E. 열리면 to 방의 at 에 나온다. need = 열리는 조건
    doors: [{ room: 0, x: 896, to: 1, at: 1036, need: 'off' }, { room: 1, x: 1318, to: 2, at: 1468, need: 'talked' }],
    doorReach: 24, doorY: 34, doorT: 0.45, exitX: 3560,
    skipRoad: true, // ⏸ D-336 오솔길을 잠깐 뺀다 — 성소의 문을 나서면 곧바로 챕터 4. false 면 길이 그대로 돌아온다
    // 처음 자리 · 🔴 실격하면 언제나 첫 가시 왼쪽에서 다시(D-107)
    spawns: [40, 385],
    // 깨어난 자리(D-105) — 앞으로 걸어 나오면 탁자 위에 수녀의 편지가 있다
    wake: { from: 12, to: 86 }, letter: { x: 170, y: 70, reach: 46 },
    // 가시 — 🔄 D-303 넷 → 셋(x 620 뺌 · 철퇴와 박자가 겹쳤다) · 쉼 → 경고 → 솟음. 🔄 D-315 솟는 순간 위에 있으면 하트 1칸 깎이고 밀려난다(즉사 아님) · 솟아 있는 동안은 벽이다(D-83)
    bands: [420, 540, 700], bandW: 30, bandEdge: 3, period: 2, rest: 0.5, warn: 0.6, bandLag: 0.55,
    // 철퇴 — 🔴 첫 가시를 지난 뒤로는 버튼을 끌 때까지 계속 떨어진다(D-104). 막으면 반 칸 깎이고, 다 닳으면 다리 밖으로 밀려 떨어진다(D-90)
    mace: { at: 452, first: 0.4, tele: 1.2, lock: 0.25, r: 26, chase: 150, rest: 0.6, blockDmg: 0.5 }, trapDmg: 1, // 🔄 D-315 함정에 그대로 맞으면 하트 1칸
    plank: { x: 800, need: 2, reach: 44, w: 24 },
    nun2: { x: 1170, y: 52 }, nunTalk: 64,
  };

  function create() {
    return { t: 0, px: 0, spawnX: T.spawns[0], m: null, planks: 0, plankDone: false, plankAt: 0, swung: false, dead: null, exit: false, room: 0, pass: null, talk: false, talked: false, off: false, read: false, letter: false, maceOn: false, bandS: [], fx: [] };
  }
  // 그 자리에서 다시 시작한다 — 깬 기구는 그대로다. 게임 자체(g)는 부르는 쪽이 새로 만든다
  function enter(g, pro) {
    S.setArena(S.L, T.W);
    Object.assign(pro, { m: { state: 'wait', t: T.mace.first, x: 0, y: 0 }, dead: null, exit: false, pass: null, talk: false, letter: false, maceOn: false, bandS: [], fx: [] });
    const p = g.player, b = g.boss;
    p.x = pro.spawnX; p.y = T.spawnY; p.fx = 1; p.fy = 0; pro.px = p.x; pro.room = roomOf(p.x);
    b.x = 99999; b.y = p.y; b.state = 'rest'; b.t = 1e9; b.execAt = Infinity; b.pat = null;
  }
  const roomOf = x => { let best = 0, bd = Infinity; T.rooms.forEach((r, i) => { const d = x < r.x0 ? r.x0 - x : x > r.x1 ? x - r.x1 : 0; if (d < bd) { bd = d; best = i; } }); return best; };
  const doorOpen = (pro, i) => (T.doors[i].need === 'off' ? pro.off : pro.talked);
  const nearDoor = (p, pro) => T.doors.findIndex((d, i) => d.room === pro.room && doorOpen(pro, i) && Math.abs(p.x - d.x) <= T.doorReach && p.y <= T.doorY);
  const inWalk = x => x > T.room1 && x < T.land;
  // 🔴 외길 — 방 사이로는 통로로만 들어가고, 안에서는 벗어나지 못한다(D-88)
  function confine(p, pro) {
    const [y0, y1] = T.walkY;
    const R = T.rooms[pro.room]; p.x = Math.max(R.x0, Math.min(R.x1, p.x)); // 🔴 방 사이는 벽이다 — 문으로만 건넌다(D-158)
    if (!inWalk(p.x)) return;
    if (!inWalk(pro.px) && (p.y < y0 || p.y > y1)) { p.x = pro.px; return; } // 벽에 막힌다
    p.y = Math.max(y0, Math.min(y1, p.y));
  }
  function bandOf(pro, i) { // 'down' · 'warn' · 'up' 과 그 안에서의 진행(0 ~ 1)
    if (pro.off) return { state: 'down', k: 0 }; // 방벽을 부숴 멈췄다(D-344)
    const u = (((pro.t - i * T.bandLag) % T.period) + T.period) % T.period;
    if (u < T.rest) return { state: 'down', k: u / T.rest };
    if (u < T.rest + T.warn) return { state: 'warn', k: (u - T.rest) / T.warn };
    return { state: 'up', k: (u - T.rest - T.warn) / (T.period - T.rest - T.warn) };
  }
  function die(g, pro, kind) {
    const p = g.player;
    p.hp = 0; p.atk = -1; p.roll = 0; p.guard = false; p.parry = 0; p.moving = false;
    g.over = 'lose'; g.cause = kind; pro.dead = kind; pro.fx.push({ type: 'dead', kind });
  }
  // 막힌 자리 — 온 쪽으로 밀어낸다. 🔴 구르기로도 못 지나간다
  function wall(p, pro, x0, x1) {
    if (p.x > x0 - T.bandEdge && p.x < x1 + T.bandEdge) p.x = pro.px <= x0 ? x0 - T.bandEdge : x1 + T.bandEdge;
  }
  function stepSpike(g, pro) {
    const p = g.player;
    T.bands.forEach((x0, i) => {
      const st = bandOf(pro, i).state, rising = st === 'up' && pro.bandS[i] !== 'up', x1 = x0 + T.bandW;
      if (rising) pro.fx.push({ type: 'spikeUp', i });
      pro.bandS[i] = st;
      if (g.over || st !== 'up') return;
      if (rising && p.x >= x0 && p.x <= x1) { // 🔄 D-315 솟는 순간에만 맞는다 · 구르기로도 못 버틴다(D-83) · 온 쪽으로 밀려난다
        S.hurtPlayer(g, T.trapDmg, 'spike', x1 + 10, p.y); if (g.over) { die(g, pro, 'spike'); return; }
        pro.px = x0 - T.bandEdge - 1;
      }
      wall(p, pro, x0, x1);
    });
  }
  function stepMace(g, pro) {
    const p = g.player, C = T.mace, m = pro.m;
    if (pro.off) return;
    if (m.state === 'flung') { m.t += DT; if (m.t >= 0.5) { m.state = 'wait'; m.t = C.rest; } return; }
    if (p.x >= C.at) pro.maceOn = true; // 🔴 한 번 지나면 뒤로 물러나도 계속 떨어진다(D-104)
    if (!pro.maceOn) return;
    p.stamina = S.TUNE.staminaMax; p.tired = false; // 기력을 재는 시험이 아니다
    if (m.state === 'wait') {
      m.t -= DT;
      if (m.t <= 0) { m.state = 'tele'; m.t = 0; m.x = p.x; m.y = p.y; pro.fx.push({ type: 'maceTele' }); }
      return;
    }
    m.t += DT;
    if (C.tele - m.t > C.lock) { // 쫓아오다 멈춘다 — 멈춘 뒤에 비키면 빗나간다
      const dx = p.x - m.x, dy = p.y - m.y, n = Math.hypot(dx, dy), d = Math.min(n, C.chase * DT);
      if (n > 0.01) { m.x += dx / n * d; m.y += dy / n * d; }
    }
    if (m.t < C.tele) return;
    const near = Math.hypot(p.x - m.x, p.y - m.y) <= C.r + S.PLAYER_R;
    if (near && p.roll <= 0) {
      if (p.parry > 0) { // 맞는 순간에 눌렀다 — 튕겨 올라간다. 피가 안 깎인다
        g.stats.parries++; p.parry = 0; p.parryCd = 0;
        g.hitStop = Math.max(g.hitStop, 0.1); g.shake = Math.max(g.shake, 0.45);
        g.events.push({ type: 'parry', x: p.x, y: p.y, exec: true, bow: false, fan: false, hx: p.x, hy: p.y, ax: p.fx, ay: 0 });
        m.state = 'flung'; m.t = 0; pro.fx.push({ type: 'maceParry' });
        return;
      }
      if (p.guard) { // 들고 막았다 — 반 칸 깎이고 밀려난다
        p.hp -= C.blockDmg; p.blockFlash = 0.16; p.kx = -46;
        g.hitStop = Math.max(g.hitStop, 0.06); g.shake = Math.max(g.shake, 0.4);
        g.events.push({ type: 'block', x: p.x, y: p.y });
        pro.fx.push({ type: 'maceBlock', x: m.x, y: m.y }); m.state = 'wait'; m.t = C.rest; m.landed = 0.3; m.lx = m.x; m.ly = m.y;
        if (p.hp <= 0) { p.hp = 0; die(g, pro, 'fall'); } // 🔴 피가 다 닳으면 다리 밖으로 밀려 떨어진다(사용자)
        return;
      }
      pro.fx.push({ type: 'maceHit', x: m.x, y: m.y }); S.hurtPlayer(g, T.trapDmg, 'mace', m.x, m.y - 6); // 🔄 D-315 하트 1칸 — 피가 다 닳았을 때만 으깨진다
      if (g.over) { die(g, pro, 'mace'); m.state = 'crush'; } else { m.state = 'wait'; m.t = C.rest; m.landed = 0.5; m.lx = m.x; m.ly = m.y; }
      return;
    }
    pro.fx.push({ type: 'maceLand', x: m.x, y: m.y }); m.state = 'wait'; m.t = C.rest; m.landed = 0.5; m.lx = m.x; m.ly = m.y; // 빗나갔다 — 다시 떨어진다
  }
  function stepPlank(g, pro) {
    const p = g.player, C = T.plank;
    if (pro.plankDone) return;
    wall(p, pro, C.x, C.x + C.w);
    for (const e of g.events) if (e.type === 'swingP') {
      pro.swung = true;
      if (Math.abs(p.x - C.x) <= C.reach) { pro.planks++; pro.fx.push({ type: 'plankHit', x: C.x + C.w / 2, y: p.y }); }
    }
    if (pro.planks >= C.need) { // 🔄 D-344 부수는 순간 함정이 모두 멈춘다(옛 D-104 의 버튼을 뺐다)
      pro.plankDone = true; pro.plankAt = pro.t; pro.off = true; if (pro.m) { pro.m.state = 'off'; pro.m.t = 0; }
      pro.fx.push({ type: 'plankBreak', x: C.x + C.w / 2 }, { type: 'trapsOff', x: C.x + C.w / 2, y: p.y });
    }
  }
  const nearLetter = (p) => Math.hypot(p.x - T.letter.x, p.y - T.letter.y) <= T.letter.reach;
  const canUse = (pro, p) => !pro.pass && (nearLetter(p) || nearDoor(p, pro) >= 0);
  // 상호작용 키 — 편지를 펼치고(D-105) · 문을 연다(D-158)
  function stepUse(g, pro) {
    const p = g.player;
    if (pro.pass || !g.events.some(e => e.type === 'useP')) return;
    const di = nearDoor(p, pro);
    if (di >= 0) { pro.pass = { i: di, t: 0, x: p.x, y: p.y, moved: false }; pro.fx.push({ type: 'doorOpen', i: di }); return; }
    if (nearLetter(p)) { pro.letter = true; pro.read = true; pro.fx.push({ type: 'letter' }); return; }
  }
  // S.step 바로 뒤에 부른다 — g.events 를 읽는다
  function step(g, pro) {
    pro.fx.length = 0;
    if (g.over) { if (!pro.dead) { pro.dead = 'spike'; pro.fx.push({ type: 'dead', kind: pro.dead }); } return; }
    const p = g.player;
    if (pro.pass) { // 문을 지나는 중 — 서 있다가 어두워진 때 다음 방 문 앞으로 옮긴다
      const ps = pro.pass, d = T.doors[ps.i]; ps.t += DT; p.moving = false; p.roll = 0;
      if (!ps.moved) { p.x = ps.x; p.y = ps.y; if (ps.t >= T.doorT && T.skipRoad && d.to === T.rooms.length - 1) { pro.pass = null; pro.exit = true; return; } if (ps.t >= T.doorT) { ps.moved = true; pro.room = d.to; p.x = d.at; p.y = T.doorY - 8; p.fx = 1; p.fy = 1; pro.fx.push({ type: 'doorPass', i: ps.i }); } }
      else { p.x = d.at; p.y = T.doorY - 8; }
      pro.px = p.x;
      if (ps.t >= T.doorT * 2) pro.pass = null;
      return;
    }
    // 🔴 타격 멈춤 앞에서 읽는다 — 벤 순간이 곧 멈춤이다
    stepPlank(g, pro);
    stepUse(g, pro);
    if (pro.m && pro.m.landed > 0) pro.m.landed -= DT;
    if (g.hitStop <= 0) {
      pro.t += DT;
      g.boss.y = p.y; g.boss.t = 1e9; // 멀리 세워 둔 보스 쪽을 본다 — 막을 때 오른쪽을 본다
      stepSpike(g, pro);
      if (!g.over) stepMace(g, pro);
    }
    if (g.over) return;
    confine(p, pro);
    if (p.x >= T.spawns[1] + 4) pro.spawnX = T.spawns[1];
    if (pro.off && !pro.talked && !pro.talk && Math.hypot(p.x - T.nun2.x, p.y - T.nun2.y) <= T.nunTalk) pro.talk = true; // 함정을 안 끄면 수녀가 말을 걸지 않는다(D-104)
    pro.px = p.x;
    if (pro.room === T.rooms.length - 1 && p.x >= T.exitX) pro.exit = true; // 오솔길 끝 → 챕터 4(D-158)
  }
  const api = { T, create, enter, step, doorOpen, nearDoor, roomOf, bandOf, inWalk, canUse, nearLetter };
  root.QueenPrologue = api;
  if (typeof module !== 'undefined') module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

// 성장 규칙 — 화면 없이 돈다. 규격 = Studio/projects/ProjectEighth/docs/system/성장(Growth)/system.md
// 🔄 D-302 재 · 레벨 · 스탯을 뺐다. 🔄 D-305 칸은 셋으로 나눈다 — 기술 · 착용 · 패시브. 🔄 D-306 패시브는 위업을 이뤄 푼다
// 🔴 체력 · 회복은 하트 1/4칸 = 1 정수로 담는다(D-220 · D-221). 게임(sim.js)에는 하트 단위로 건넨다(÷ 4)
(function (root) {
  'use strict';
  // 🔸 AI 잠정 — 값은 이 표 하나에만 둔다
  const TABLE = {
    baseHpQ: 20, // 최대 체력 = 하트 5칸
    flaskHealQ: 4, // 성수병 하트 1칸(D-220 · 확정)
    fpBase: 30, // 기술 자원 — 최대치만(D-216)
    slots: { wear: 3, passive: 6 }, // 🔸 D-305 칸 수(기술은 1칸) · 🔄 D-328 패시브 6칸
  };
  // 🔸 견본(D-224) — 이름 · 목록 · 얻는 곳은 사용자가 정한다
  const SKILLS = {
    spin: { name: '회전 베기', note: '몸 둘레를 벤다 · 자원 15 · 피해 24', kind: 'attack', cost: 15, r: 34, dmg: 24 }, // 특수 공격
    resolve: { name: '결의', note: '10초 동안 공격 ×1.2 · 자원 20', kind: 'buff', cost: 20, durSec: 10, mul: 12000 }, // 버프(만분율)
  };
  // 착용 — 끼면 쓰거나 무언가를 일으킨다(D-305). 🔴 성수병도 끼어야 마실 수 있다
  const ITEMS = {
    flask: { name: '성수병', note: 'R 로 마신다 · 하트 1칸 · 제단에서 다시 찬다. 끼지 않으면 못 마신다' },
    ward: { name: '수호의 부적', note: '죽음을 한 번 막고 하트 1칸으로 남는다 · 즉사기도 막는다 · 제단과 새 판에 다시 찬다' }, // 🔸 이름 · 하트 1칸
    foresight: { name: '예견안', note: '끼면 보스와 마주칠 때 조우 필살기가 나간다 · 끼지 않으면 나가지 않는다' }, // 🔸 D-327 소모되지 않는다
  };
  // 패시브 — 끼면 늘 켜져 있다(D-305). 위업을 이루면 풀린다(D-306)
  //   🔸 D-360 쓸 수 있는 값 = rollCostMul · staminaMul(만분율) · flaskQ(회복 1/4칸) · hpQ(최대 체력 1/4칸 · 🔴 4의 배수만 — 칸이 통째로 늘어난다 D-366) · flaskN(성수병 병 수) · fpPlus(기술 자원)
  const PASSIVES = {
    lightFoot: { name: '가벼운 발', note: '구르기 기력 −25%', rollCostMul: 7500 },
    steadyBreath: { name: '단단한 숨', note: '기력 최대 +20%', staminaMul: 12000 },
    bigFlask: { name: '큰 성수병', note: '성수병 회복 +1/2칸', flaskQ: 2 },
  };
  // 🔸 위업(D-306) — 이름 · 조건은 AI 초안
  const FEATS = [
    { id: 'hunter', name: '길을 정화한 자', goalText: '길의 짐승을 벤다', goal: 20, count: pf => (pf.tally.kills.small || 0) + (pf.tally.kills.big || 0), passive: 'lightFoot' },
    { id: 'parrier', name: '받아 낸 칼', goalText: '공격을 패링한다', goal: 50, count: pf => pf.tally.parries, passive: 'steadyBreath' },
    { id: 'seventh', name: '7번째 용사를 베다', goalText: '아나샤를 이긴다', goal: 1, count: pf => pf.tally.wins.queen || 0, passive: 'bigFlask' },
  ];
  // 🔸 보스가 주는 기술(D-215 · D-229) — 아나샤 = 회전 베기(그녀의 광란 난타를 닮았다). 목록 · 얻는 곳은 사용자가 정한다
  const REWARD = { queen: { skill: 'spin' } };
  const SAVE_KEY = 'eighth.growth.v1';

  function create() {
    return { v: 3, altar: null, skills: [], skill: null, items: ['flask'], wear: ['flask'].concat(Array(TABLE.slots.wear - 1).fill(null)), passives: [], passiveOn: Array(TABLE.slots.passive).fill(null), feats: [], tally: { kills: {}, parries: 0, wins: {} }, seen: {}, far: 0 };
  }
  const on = (ids, tbl) => (ids || []).map(c => c && tbl[c]).filter(Boolean);
  // 게임에 건넬 몸 — sim.createGame(seed, build). base = sim 의 TUNE
  function build(pf, base) {
    const P = on(pf.passiveOn, PASSIVES), wear = pf.wear || [];
    return {
      maxHp: (TABLE.baseHpQ + P.reduce((n, c) => n + (c.hpQ || 0), 0)) / 4,

      // 🔸 성장 처음부터 — 폰에는 F7 이 없다. 성장이 있을 때만 · 두 번 눌러야 지운다(D-213 · 성장은 이 브라우저에 남는다)
      const rb = $('resetBtn'), has = () => growth.skills.length; let armed = 0;
      const label = () => { rb.textContent = `성장 처음부터 · 기술 ${growth.skills.length}개`; };
      rb.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (performance.now() - armed > 5000) { armed = performance.now(); rb.textContent = '한 번 더 누르면 얻은 기술이 지워져요'; return; } growth = GR.reset(); GR.save(growth); rb.textContent = '처음부터'; armed = 0; setTimeout(() => { rb.hidden = true; }, 1200); });
    }
  }).catch(e => {
    $('ovH').textContent = `그림을 불러오지 못했어요: ${e.message}`;
  });
  requestAnimationFrame(frame);
})();
</script>
